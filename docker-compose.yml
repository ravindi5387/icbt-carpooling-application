services:
  db:
    image: postgres:16-alpine
    container_name: icbt-carpooling-db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: post123
      POSTGRES_DB: icbt_carpooling

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d icbt_carpooling"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: icbt-carpooling-backend

    env_file:
      - ./backend/.env

    environment:
      DATABASE_URL: postgresql://postgres:post123@db:5432/icbt_carpooling

    ports:
      - "5000:5000"

    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: icbt-carpooling-frontend

    ports:
      - "5173:80"

    depends_on:
      - backend

volumes:
  postgres_data:
